<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prototype 10 — Reverse Gate Runner</title>
<style>
  html, body { margin:0; padding:0; background:#0b0e14; height:100%; overflow:hidden; touch-action:none; }
  #wrap { display:flex; align-items:center; justify-content:center; height:100%; }
  canvas { background:#151a23; box-shadow:0 0 60px rgba(0,0,0,.6); border-radius:6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cvs" width="480" height="800"></canvas></div>
<script>
'use strict';
const W = 480, H = 800;
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');

// =====================================================================
// TUNING — every balance dial lives here, with the reasoning attached.
// =====================================================================
const TUNE = {
  goal: 300,                 // meters to push back before the Warlord (≈3.5–4.5 min run)
  hero: {
    dmg: 2,
    fireInt: 0.26,           // start dps ≈ 7.7 → one loose grunt dies in ~0.5s of focus
    bulletSpeed: 540,
    moveLerp: 30,            // near-instant follow — sluggish controls kill fast decisions
    dragSense: 1.7,          // touch: hero moves 1.7× your finger delta (finger never covers hero)
  },
  grunt: { hp:3.5, hpScale:2.0, speed:42, speedScale:30, r:11, meters:2, hearts:1 },
  brute: { hp:13,  hpScale:2.2, speed:30, speedScale:20, r:17, meters:5, hearts:2 },
  boss:  { hp:750, speed:12, r:42 },
  // The horde marches in a corridor that WIDENS as you get stronger.
  // With 1 shot you can only defend a narrow strip; the field must grow
  // with your firepower, not start at full width.
  corridor: { start:0.55, end:1.0 },
  // Pacing: quiet trickle punctuated by surges → tension rhythm instead of noise.
  trickle: { startInt:1.4, endInt:0.55, denStart:0.5, denScale:2.5 }, // early ≈1 orc/1.4s
  surge:   { first:14, every:8, size:3, sizeScale:5 },  // first surge only after 14s
  gates: {
    first: 2,                // teach the core mechanic within seconds
    min: 8, max: 11,         // thereafter a pair every 8–11s
    squadSize: 5,
    // KEY RULE: squad HP scales with the player's CURRENT dps so that wiping
    // a squad always takes ~focusSeconds of focused fire. The choice must
    // stay "which gate", never "can I even get one".
    focusSeconds: 2.3,
    hitEfficiency: 0.7,      // you never land 100% of shots while dodging
    minOrcHp: 3,
    // THE GREED LINE — the identity mechanic. Gates TIER UP as they approach:
    // bronze at spawn, silver at 45% of the march, gold at 75% (right above
    // your line). Claim early = safe but weak; let it come = strong but the
    // squad is about to break through and the rest of the horde marches on.
    // In a runner the choice is free; here choosing has a price. Waiting is
    // the bet, leaking is the bust.
    tierAt: [0.45, 0.75],
  },
  slowmo: { scale:0.35, dur:0.28 },  // short readable beat — must not break flow
  leakGraceY: 150,           // danger line height above bottom
};
const LINE_Y = H - TUNE.leakGraceY;

// ---------- responsive scale ----------
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
  cvs.style.width  = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---------- tiny audio ----------
let AC = null;
function beep(freq, dur, type, vol) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}

// ---------- input ----------
// Touch: RELATIVE drag — finger anywhere on screen, hero moves by the delta
// (amplified), so your finger never covers the action and small flicks are
// enough to dart between lanes. Mouse: hero follows the cursor x directly.
let targetX = W / 2, dragLast = null;
function toGame(e) {
  const r = cvs.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  return (cx - r.left) / r.width * W;
}
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
}
cvs.addEventListener('mousedown', e => {
  ensureAudio();
  if (state !== 'play') startRun();
  targetX = toGame(e);
  e.preventDefault();
});
cvs.addEventListener('mousemove', e => {
  if (state === 'play') targetX = toGame(e);
});
cvs.addEventListener('touchstart', e => {
  ensureAudio();
  if (state !== 'play') startRun();
  dragLast = toGame(e);
  e.preventDefault();
}, { passive:false });
cvs.addEventListener('touchmove', e => {
  const x = toGame(e);
  if (dragLast != null) targetX += (x - dragLast) * TUNE.hero.dragSense;
  dragLast = x;
  e.preventDefault();
}, { passive:false });
window.addEventListener('touchend', () => dragLast = null);

// ---------- upgrades (bronze / silver / gold effects per tier) ----------
const UPGRADES = [
  { key:'dmg',    color:'#4ade80',
    labels:['DAMAGE +40%','DAMAGE +70%','DAMAGE +120%'],
    apply:(p,t) => p.dmg *= [1.4, 1.7, 2.2][t] },
  { key:'rate',   color:'#facc15',
    labels:['FIRE RATE ×1.25','FIRE RATE ×1.45','FIRE RATE ×1.7'],
    apply:(p,t) => p.fireInt = Math.max(0.06, p.fireInt * [0.80, 0.69, 0.59][t]) },
  { key:'multi',  color:'#38bdf8',
    labels:['+1 SHOT','+2 SHOTS','+3 SHOTS'],
    apply:(p,t) => p.shots += t + 1 },
  { key:'pierce', color:'#c084fc',
    labels:['PIERCING +1','PIERCING +2','PIERCING +3'],
    apply:(p,t) => p.pierce += t + 1 },
  { key:'ally',   color:'#fb923c',
    labels:['+1 ALLY','+2 ALLIES','+3 ALLIES'],
    apply:(p,t) => p.allies += t + 1 },
];
const TIER_COLORS = ['#cd7f32', '#cbd5e1', '#fbbf24'];
const TIER_NAMES  = ['BRONZE', 'SILVER', 'GOLD'];
function pickTwoUpgrades() {
  const a = UPGRADES[(Math.random() * UPGRADES.length) | 0];
  let b = a;
  while (b === a) b = UPGRADES[(Math.random() * UPGRADES.length) | 0];
  return [a, b];
}

// ---------- state ----------
let state = 'menu'; // menu | play | over | win
let P = null, bullets = [], enemies = [], pairs = [], parts = [], texts = [], flyers = [];
let meters = 0, boss = null, bossSpawned = false, bossWarned = false;
let shake = 0, scroll = 0, trickleT = 0, surgeT = 0, gateT = 0, time = 0, kills = 0;
let timeScale = 1, slowmoT = 0;

function startRun() {
  P = { x:W/2, tx:W/2, y:H-95, hearts:10,
        dmg:TUNE.hero.dmg, fireInt:TUNE.hero.fireInt, shots:1, pierce:0, allies:0,
        fireT:0, gunLvl:0 };
  bullets = []; enemies = []; pairs = []; parts = []; texts = []; flyers = [];
  meters = 0; boss = null; bossSpawned = false; bossWarned = false;
  shake = 0; scroll = 0; trickleT = 0.6; surgeT = TUNE.surge.first;
  gateT = TUNE.gates.first; time = 0; kills = 0;
  timeScale = 1; slowmoT = 0; targetX = W / 2; dragLast = null;
  state = 'play';
}

// ---------- difficulty ----------
// Mostly meters-driven (progress = danger), with a slow time drip so a
// stalling player can't farm a frozen difficulty forever.
function difficulty() { return Math.min(1, meters / TUNE.goal + time / 600); }

function playerDps() {
  return (P.dmg * P.shots + P.dmg * 0.4 * P.allies) / P.fireInt;
}
function squadOrcHp() {
  const total = playerDps() * TUNE.gates.hitEfficiency * TUNE.gates.focusSeconds;
  return Math.max(TUNE.gates.minOrcHp, total / TUNE.gates.squadSize);
}

// ---------- spawning ----------
function spawnGrunt(x, y, group, hpOverride) {
  const t = difficulty(), c = TUNE.grunt;
  const e = { x, y, r:c.r, hp:hpOverride || c.hp*(1+c.hpScale*t), speed:c.speed+c.speedScale*t,
              kind:'grunt', group:group||null, wob:Math.random()*6.28 };
  e.maxhp = e.hp; enemies.push(e); return e;
}
function spawnBrute(x, y) {
  const t = difficulty(), c = TUNE.brute;
  const e = { x, y, r:c.r, hp:c.hp*(1+c.hpScale*t), speed:c.speed+c.speedScale*t,
              kind:'brute', group:null, wob:Math.random()*6.28 };
  e.maxhp = e.hp; enemies.push(e); return e;
}
function corridorX(frac01) {
  const t = difficulty();
  const cw = (W - 80) * (TUNE.corridor.start + (TUNE.corridor.end - TUNE.corridor.start) * t);
  return W / 2 + (frac01 - 0.5) * cw;
}
function spawnTrickle() {
  const t = difficulty();
  const n = 1 + ((Math.random() * (TUNE.trickle.denStart + t * TUNE.trickle.denScale)) | 0);
  for (let i = 0; i < n; i++) {
    const x = corridorX(Math.random());
    if (Math.random() < 0.10 + t * 0.15) spawnBrute(x, -20 - Math.random() * 60);
    else spawnGrunt(x, -20 - Math.random() * 60, null);
  }
}
function spawnSurge() {
  const t = difficulty();
  const n = (TUNE.surge.size + t * TUNE.surge.sizeScale) | 0;
  for (let i = 0; i < n; i++) {
    const x = corridorX((i + 0.5) / n) + (Math.random() * 20 - 10);
    spawnGrunt(x, -20 - Math.random() * 40, null);
  }
  addText(W/2, 120, 'SURGE!', '#f87171', 1.0);
}
function spawnGatePair() {
  const [ua, ub] = pickTwoUpgrades();
  const pair = { groups: [] };
  const centers = [W * 0.27, W * 0.73];
  const orcHp = squadOrcHp();
  [ua, ub].forEach((upg, gi) => {
    const g = { cx: centers[gi], upg, tier:0, pop:0, broken:false, rewarded:false, orcs: [] };
    for (let i = 0; i < TUNE.gates.squadSize; i++) {
      const ox = g.cx + (i % 3 - 1) * 26 + (Math.random() * 8 - 4);
      const oy = -40 - ((i / 3) | 0) * 30 - Math.random() * 8;
      g.orcs.push(spawnGrunt(ox, oy, g, orcHp));
    }
    pair.groups.push(g);
  });
  pairs.push(pair);
}
function spawnBoss() {
  const c = TUNE.boss;
  const e = { x:W/2, y:-70, r:c.r, hp:c.hp, speed:c.speed, kind:'boss', group:null, wob:0 };
  e.maxhp = e.hp; enemies.push(e); boss = e; bossSpawned = true;
  addText(W/2, 260, 'THE WARLORD APPROACHES!', '#f87171', 2.6);
  beep(90, 0.6, 'sawtooth', 0.12);
}

// ---------- fx ----------
function addText(x, y, str, color, life) {
  texts.push({ x, y, str, color, life: life || 1.4, max: life || 1.4 });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 40 + Math.random() * 140;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.4+Math.random()*0.3, color });
  }
}
function bannerPos(g) {
  const alive = g.orcs.filter(o => !o.dead);
  if (!alive.length) return null;
  let minY = 1e9;
  for (const o of alive) minY = Math.min(minY, o.y);
  return { x: g.cx, y: Math.max(76, minY - 36) };
}

// ---------- group / gate logic ----------
function claimGate(g, atX, atY) {
  g.rewarded = true;
  g.upg.apply(P, g.tier);
  P.gunLvl++;
  // banner flies to the hero — the "you picked THIS" beat
  flyers.push({ kind:'claim', x:atX, y:atY, label:g.upg.labels[g.tier], color:g.upg.color, frame:TIER_COLORS[g.tier], t:0 });
  burst(atX, atY, TIER_COLORS[g.tier], 20);
  timeScale = TUNE.slowmo.scale; slowmoT = TUNE.slowmo.dur;
  beep(520, 0.15, 'square', 0.08); beep(780, 0.2, 'square', 0.08);
  // the other gate in the pair visibly shatters
  const pair = pairs.find(pr => pr.groups.includes(g));
  if (pair) pair.groups.forEach(og => { if (og !== g && !og.rewarded) breakGate(og, 'rejected'); });
}
function breakGate(g, reason) {
  if (g.broken || g.rewarded) return;
  g.broken = true;
  const pos = bannerPos(g) || { x:g.cx, y:LINE_Y - 60 };
  g.orcs.forEach(o => o.group = null);
  // banner falls off screen with a cross through it — you SEE it break
  flyers.push({ kind:'break', x:pos.x, y:pos.y, label:g.upg.labels[g.tier], color:g.upg.color,
                t:0, vx:(Math.random()*60-30), vy:-60, rot:0, vr:(Math.random()<0.5?-1:1)*(2+Math.random()*2) });
  burst(pos.x, pos.y, '#94a3b8', 10);
  if (reason === 'leaked') addText(pos.x, pos.y - 20, 'GATE LOST', '#94a3b8', 1.2);
  beep(200, 0.12, 'sawtooth', 0.05);
}
function onEnemyKilled(e) {
  kills++;
  const c = TUNE[e.kind];
  if (c) meters += c.meters || 0;
  burst(e.x, e.y, e.kind === 'boss' ? '#f87171' : '#6ee7a0', e.kind === 'grunt' ? 8 : 16);
  if (e.kind === 'boss') { state = 'win'; beep(660, 0.5, 'square', 0.1); return; }
  const g = e.group;
  if (g) {
    g.orcs = g.orcs.filter(o => o !== e);
    if (!g.broken && !g.rewarded && g.orcs.length === 0) claimGate(g, e.x, e.y);
  }
}
function onEnemyLeaked(e) {
  if (e.group) breakGate(e.group, 'leaked');
  if (e.kind === 'boss') { P.hearts = 0; return; }
  P.hearts -= TUNE[e.kind].hearts;
  shake = 10;
  burst(e.x, LINE_Y, '#f87171', 14);
  beep(120, 0.2, 'sawtooth', 0.1);
}

// ---------- update ----------
function update(dt) {
  time += dt;
  const t = difficulty();

  // hero movement
  targetX = Math.max(24, Math.min(W - 24, targetX));
  P.x += (targetX - P.x) * Math.min(1, dt * TUNE.hero.moveLerp);

  // firing (hero + allies fire together)
  P.fireT -= dt;
  if (P.fireT <= 0) {
    P.fireT = P.fireInt;
    const spread = (P.shots - 1) * 7;
    for (let s = 0; s < P.shots; s++) {
      const off = P.shots === 1 ? 0 : -spread / 2 + s * 7;
      bullets.push({ x:P.x + off, y:P.y - 26, vx:off * 1.2, vy:-TUNE.hero.bulletSpeed, dmg:P.dmg, pierce:P.pierce, ally:false });
    }
    for (let a = 0; a < P.allies; a++) {
      const side = a % 2 === 0 ? -1 : 1;
      const ax = P.x + side * (34 + 28 * ((a / 2) | 0));
      bullets.push({ x:ax, y:P.y - 8, vx:0, vy:-500, dmg:P.dmg * 0.4, pierce:0, ally:true });
    }
  }

  // bullets
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  // enemies march
  for (const e of enemies) {
    e.wob += dt * 5;
    e.y += e.speed * dt;
    e.x += Math.sin(e.wob) * 6 * dt;
    if (e.y >= LINE_Y && !e.dead) { e.dead = true; onEnemyLeaked(e); }
  }

  // collisions
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < (e.r + 4) * (e.r + 4)) {
        e.hp -= b.dmg;
        e.flash = 0.06;
        if (e.hp <= 0) { e.dead = true; onEnemyKilled(e); }
        if (b.pierce > 0) b.pierce--; else { b.dead = true; break; }
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
  bullets = bullets.filter(b => !b.dead);
  pairs = pairs.filter(pr => pr.groups.some(g => !g.broken && !g.rewarded && g.orcs.length));

  // greed line: gates tier up as their squad nears your line
  for (const pr of pairs) for (const g of pr.groups) {
    if (g.broken || g.rewarded || !g.orcs.length) continue;
    let front = -1e9;
    for (const o of g.orcs) front = Math.max(front, o.y);
    const frac = front / LINE_Y;
    const newTier = frac >= TUNE.gates.tierAt[1] ? 2 : frac >= TUNE.gates.tierAt[0] ? 1 : 0;
    if (newTier > g.tier) {
      g.tier = newTier; g.pop = 0.35;
      const pos = bannerPos(g);
      if (pos) {
        addText(pos.x, pos.y - 24, TIER_NAMES[newTier] + '!', TIER_COLORS[newTier], 1.1);
        burst(pos.x, pos.y, TIER_COLORS[newTier], 10);
      }
      beep(newTier === 2 ? 940 : 700, 0.12, 'square', 0.06);
    }
    if (g.pop > 0) g.pop -= dt;
  }

  // spawning
  if (!bossSpawned) {
    trickleT -= dt;
    if (trickleT <= 0) {
      trickleT = TUNE.trickle.startInt + (TUNE.trickle.endInt - TUNE.trickle.startInt) * t;
      spawnTrickle();
    }
    surgeT -= dt;
    if (surgeT <= 0) { surgeT = TUNE.surge.every; spawnSurge(); }
    gateT -= dt;
    if (gateT <= 0) {
      gateT = TUNE.gates.min + Math.random() * (TUNE.gates.max - TUNE.gates.min);
      spawnGatePair();
    }
    if (meters >= TUNE.goal) spawnBoss();
    else if (meters >= TUNE.goal * 0.85 && !bossWarned) {
      bossWarned = true;
      addText(W/2, 300, 'The horde thins out…', '#e2e8f0', 2);
    }
  }

  // fx
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const ft of texts) { ft.y -= 22 * dt; ft.life -= dt; }
  texts = texts.filter(ft => ft.life > 0);
  for (const f of flyers) {
    f.t += dt;
    if (f.kind === 'claim') {
      f.x += (P.x - f.x) * Math.min(1, dt * 9);
      f.y += (P.y - 70 - f.y) * Math.min(1, dt * 9);
      if (f.t > 0.55) { f.dead = true; addText(P.x, P.y - 70, f.label + '!', f.color, 1.6); }
    } else {
      f.vy += 500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
      if (f.t > 1.3) f.dead = true;
    }
  }
  flyers = flyers.filter(f => !f.dead);

  shake = Math.max(0, shake - dt * 30);
  scroll = (scroll + (30 + t * 30) * dt) % 64;

  if (P.hearts <= 0) { state = 'over'; beep(70, 0.8, 'sawtooth', 0.12); }
}

// ---------- draw ----------
function drawOrc(e) {
  const flash = e.flash > 0;
  if (e.flash > 0) e.flash -= 1 / 60;
  // squad ring in its gate's color — you see WHICH squad carries WHICH gate
  if (e.group && !e.group.broken && !e.group.rewarded) {
    ctx.strokeStyle = e.group.upg.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, 6.28); ctx.stroke();
  }
  ctx.fillStyle = flash ? '#ffffff' : (e.kind === 'boss' ? '#b91c1c' : e.kind === 'brute' ? '#65a30d' : '#4d7c0f');
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = flash ? '#000' : '#fde047';
  ctx.beginPath(); ctx.arc(e.x - e.r * 0.35, e.y - e.r * 0.15, e.r * 0.16, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(e.x + e.r * 0.35, e.y - e.r * 0.15, e.r * 0.16, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(e.x - e.r * 0.4, e.y + e.r * 0.3, 3, 5);
  ctx.fillRect(e.x + e.r * 0.4 - 3, e.y + e.r * 0.3, 3, 5);
  if (e.kind === 'boss') {
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.moveTo(e.x - 24, e.y - e.r - 2);
    ctx.lineTo(e.x - 24, e.y - e.r - 18); ctx.lineTo(e.x - 12, e.y - e.r - 6);
    ctx.lineTo(e.x, e.y - e.r - 20); ctx.lineTo(e.x + 12, e.y - e.r - 6);
    ctx.lineTo(e.x + 24, e.y - e.r - 18); ctx.lineTo(e.x + 24, e.y - e.r - 2);
    ctx.closePath(); ctx.fill();
  }
  if (e.maxhp > 6 && e.hp < e.maxhp) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(e.x - w/2, e.y - e.r - 10, w, 4);
    ctx.fillStyle = '#f87171'; ctx.fillRect(e.x - w/2, e.y - e.r - 10, w * Math.max(0, e.hp / e.maxhp), 4);
  }
}

function drawBanner(x, y, label, color, opts) {
  const w = 132, h = 26;
  const scale = (opts && opts.scale) || 1;
  const rot = (opts && opts.rot) || 0;
  const alpha = (opts && opts.alpha != null) ? opts.alpha : 1;
  const frame = (opts && opts.frame) || color;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(10,12,18,.88)';
  ctx.fillRect(-w/2, -h/2, w, h);
  ctx.strokeStyle = frame; ctx.lineWidth = (opts && opts.tier) === 2 ? 3 : 2;
  ctx.strokeRect(-w/2, -h/2, w, h);
  if (opts && opts.tier != null) {
    ctx.fillStyle = frame;
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★'.repeat(opts.tier + 1), 0, -h/2 - 7);
  }
  ctx.fillStyle = color;
  ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 0);
  if (opts && opts.crossed) {
    ctx.strokeStyle = '#f87171'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-w/2 + 6, -h/2 + 4); ctx.lineTo(w/2 - 6, h/2 - 4);
    ctx.moveTo(w/2 - 6, -h/2 + 4); ctx.lineTo(-w/2 + 6, h/2 - 4);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawGateBanner(g) {
  const pos = bannerPos(g);
  if (!pos || pos.y < 10) return;
  drawBanner(pos.x, pos.y, g.upg.labels[g.tier], g.upg.color,
             { frame: TIER_COLORS[g.tier], tier: g.tier, scale: 1 + Math.max(0, g.pop) * 0.8 });
  const alive = g.orcs.filter(o => !o.dead);
  ctx.strokeStyle = 'rgba(148,163,184,.5)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pos.x - 56, pos.y + 13); ctx.lineTo(alive[0].x, alive[0].y);
  ctx.moveTo(pos.x + 56, pos.y + 13); ctx.lineTo(alive[alive.length-1].x, alive[alive.length-1].y);
  ctx.stroke();
}

function drawHero() {
  const lvl = Math.min(6, P.gunLvl);
  for (let a = 0; a < P.allies; a++) {
    const side = a % 2 === 0 ? -1 : 1;
    const ax = P.x + side * (34 + 28 * ((a / 2) | 0));
    ctx.fillStyle = '#93c5fd';
    ctx.beginPath(); ctx.arc(ax, P.y + 4, 9, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#475569'; ctx.fillRect(ax - 2, P.y - 14, 4, 14);
  }
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.arc(P.x, P.y, 15, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
  const gw = 6 + lvl * 2, gl = 26 + lvl * 3;
  ctx.fillStyle = ['#64748b','#64748b','#0ea5e9','#0ea5e9','#a855f7','#a855f7','#f59e0b'][lvl];
  ctx.fillRect(P.x - gw/2, P.y - 14 - gl, gw, gl);
  ctx.fillStyle = '#334155';
  ctx.fillRect(P.x - gw/2 - 2, P.y - 16, gw + 4, 8);
}

function drawUI() {
  const bw = W - 120, bx = 20, by = 24;
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx, by, bw, 12);
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(bx, by, bw * Math.min(1, meters / TUNE.goal), 12);
  ctx.strokeStyle = '#334155'; ctx.strokeRect(bx, by, bw, 12);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(bx + bw + 8, by - 4, 20, 20);
  ctx.fillRect(bx + bw + 6, by - 8, 4, 6); ctx.fillRect(bx + bw + 16, by - 8, 4, 6); ctx.fillRect(bx + bw + 26, by - 8, 4, 6);
  ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('PUSHED ' + (meters | 0) + 'm / ' + TUNE.goal + 'm', bx, by + 18);
  ctx.textAlign = 'right';
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i < P.hearts ? '#f87171' : 'rgba(255,255,255,.12)';
    ctx.fillRect(W - 24 - i * 14, by + 20, 10, 10);
  }
  ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace';
  ctx.fillText('KILLS ' + kills, W - 20, by + 36);
}

function overlay(title, sub, color) {
  ctx.fillStyle = 'rgba(6,8,12,.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color; ctx.font = 'bold 34px monospace'; ctx.textBaseline = 'middle';
  ctx.fillText(title, W/2, H/2 - 60);
  ctx.fillStyle = '#e2e8f0'; ctx.font = '15px monospace';
  const lines = sub.split('\n');
  lines.forEach((l, i) => ctx.fillText(l, W/2, H/2 - 10 + i * 24));
  if ((performance.now() / 500 | 0) % 2 === 0) {
    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 16px monospace';
    ctx.fillText('▶ TAP / CLICK TO ' + (state === 'menu' ? 'START' : 'RETRY'), W/2, H/2 + 110);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (shake > 0) ctx.translate((Math.random()-0.5) * shake, (Math.random()-0.5) * shake);

  ctx.fillStyle = '#1c2431'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.03)';
  for (let y = -64 + scroll; y < H; y += 64) ctx.fillRect(0, y, W, 26);
  ctx.strokeStyle = 'rgba(248,113,113,.55)'; ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(0, LINE_Y); ctx.lineTo(W, LINE_Y); ctx.stroke();
  ctx.setLineDash([]);

  for (const b of bullets) {
    ctx.fillStyle = b.ally ? '#93c5fd' : '#fde047';
    ctx.fillRect(b.x - 2, b.y - 7, 4, 10);
  }
  for (const e of enemies) drawOrc(e);
  for (const pr of pairs) for (const g of pr.groups) if (!g.broken && !g.rewarded && g.orcs.length) drawGateBanner(g);
  if (P) drawHero();
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    ctx.globalAlpha = 1;
  }
  // flying / breaking banners on top — the choice moment must be unmissable
  for (const f of flyers) {
    if (f.kind === 'claim') drawBanner(f.x, f.y, f.label, f.color, { scale: 1 + f.t * 0.7, frame: f.frame });
    else drawBanner(f.x, f.y, f.label, '#64748b', { rot: f.rot, alpha: Math.max(0, 1 - f.t / 1.3), crossed: true });
  }
  for (const ft of texts) {
    ctx.globalAlpha = Math.min(1, ft.life / ft.max * 1.6);
    ctx.fillStyle = ft.color; ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ft.str, ft.x, ft.y);
    ctx.globalAlpha = 1;
  }
  if (P) drawUI();

  // slow-mo vignette
  if (timeScale < 1) {
    ctx.fillStyle = 'rgba(56,189,248,.06)';
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'menu') {
    overlay('PROTOTYPE 10', 'REVERSE GATE RUNNER\n\nDrag to move — you fire automatically.\nOrc squads carry upgrade gates:\nwipe a squad to claim its gate.\nShooting IS choosing.\n\nGates grow BRONZE → SILVER → GOLD\nas they near your line.\nGreed wisely.\n\nPush the horde back ' + TUNE.goal + 'm\nand slay the Warlord.', '#4ade80');
  } else if (state === 'over') {
    overlay('OVERRUN', 'The horde broke through.\n\nPushed back: ' + (meters|0) + 'm\nKills: ' + kills, '#f87171');
  } else if (state === 'win') {
    overlay('WARLORD SLAIN', 'You pushed the horde back\nto its castle and won!\n\nKills: ' + kills, '#fbbf24');
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (state === 'play') {
    slowmoT -= dt;
    if (slowmoT <= 0) timeScale = 1;
    update(dt * timeScale);
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
